<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GymShark</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="theme-switch-wrapper">
        <span id="theme-label">Claro</span>
        <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox" />
            <div class="slider round"></div>
        </label>
    </div>

    <div class="login-container">
        
        <div class="user-icon-container">
            <i class="fas fa-user"></i>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="ID o Email" required>
            </div>

            <div class="input-group" style="position: relative;">
                <i class="fas fa-lock"></i>
                
                <input type="password" id="password" class="input-pass-padding" placeholder="Contraseña" required>
                
                <i class="fas fa-eye" id="togglePassword"></i>
            </div>

            <a href="#" class="forgot-pass">Restablecer Contraseña</a>

            <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>

        <a href="../registro/registro.html" class="link-register">Registrarse</a>
    </div>

    <script src="login.js"></script>
</body>
</html>
