<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - MAKIA</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="user-header">
                <div class="avatar"><i class="fas fa-user-circle"></i></div>
                <span>Usuario</span>
            </div>
            
            <div class="sidebar-selectors">
                <div class="select-group">
                    <label>DB :</label>
                    <select id="dbSelector">
                        <option value="">Seleccionar DB</option>
                    </select>
                </div>
                <div class="select-group">
                    <label>Funciones :</label>
                    <select id="funcSelector">
                        <option value="">Seleccionar</option>
                        <option value="sql">SQL COMMAND</option>
                        <option value="import">IMPORTAR</option>
                        <option value="export">EXPORTAR</option>
                        <option value="create">CREAR TABLA</option>
                    </select>
                </div>
            </div>

            <nav class="sidebar-menu" id="tablesNav">
                <p class="nav-hint">Seleccione una DB para ver tablas</p>
            </nav>
        </aside>

        <main class="main-content">
            <h1 class="main-title" id="currentTableName">NombreTabla1</h1>
            
            <div class="top-actions">
                <button class="btn-primary">AGREGAR</button>
                <button class="btn-primary">DUPLICAR</button>
                <button class="btn-primary">EDITAR</button>
                <button class="btn-primary">ELIMINAR</button>
            </div>

            <div class="table-section">
                <div class="table-header-tools">
                    <label class="check-all">
                        <input type="checkbox" id="selectAll"> Seleccionar todo
                    </label>
                    </div>

                <table class="main-table">
                    <thead>
                        <tr>
                            <th><input type="checkbox"></th>
                            <th>ID</th>
                            <th>Columna 1</th>
                            <th>Columna 2</th>
                            <th>Columna 3</th>
                            <th>Columna 4</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        </tbody>
                </table>
                
                <div class="pagination">
                    <button class="btn-nav"><i class="fas fa-chevron-left"></i></button>
                    <button class="btn-nav"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </main>
    </div>
    <script src="admin.js"></script>
</body>
</html>
