<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - MAKIA</title>
    <link rel="stylesheet" href="/adminview/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="user-header">
                <div class="avatar"><i class="fas fa-user-circle"></i></div>
                <span>Usuario</span>
            </div>
            
            <div class="sidebar-selectors">
                <div class="select-group">
                    <label>DB :</label>
                    <select id="dbSelector">
                        <option value="">Seleccionar DB</option>
                    </select>
                </div>
                <div class="select-group">
                    <label>Funciones :</label>
                    <select id="funcSelector">
                        <option value="">Seleccionar</option>
                        <option value="sql">SQL COMMAND</option>
                        <option value="import">IMPORTAR</option>
                        <option value="export">EXPORTAR</option>
                        <option value="create">CREAR TABLA</option>
                    </select>
                </div>
            </div>

            <nav class="sidebar-menu" id="tablesNav">
                <p class="nav-hint">Seleccione una DB para ver tablas</p>
            </nav>
        </aside>

        <main class="main-content">
            <h1 class="main-title" id="currentTableName">NombreTabla1</h1>
            
            <div class="top-actions">
                <button class="btn-primary">AGREGAR</button>
                <button class="btn-primary">EDITAR</button>
                <button class="btn-primary">ELIMINAR</button>
            </div>

            <div class="table-section">
                <div class="table-header-tools">
                    <label class="check-all">
                        <input type="checkbox" id="selectAll"> Seleccionar todo
                    </label>
                    </div>

                <table class="main-table">
                    <thead id="adminTableHead">
                    </thead>
                <tbody id="adminTableBody">
                    </tbody>
                </table>
                
                <div class="pagination">
                    <button class="btn-nav"><i class="fas fa-chevron-left"></i></button>
                    <button class="btn-nav"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </main>
    </div>
    <script src="/adminview/admin.js"></script>
    <div id="dynamicModal" class="modal" style="display:none; position:fixed; z-index:100; left:0; top:0; width:100%; height:100%; background: rgba(0,0,0,0.5);">
    <div style="background:white; margin:10% auto; padding:20px; width:40%; border-radius:8px;">
        <h3 id="modalTitle">Nuevo Registro</h3>
        <hr>
        <div id="modalFields">
            </div>
        <hr>
        <button id="btnSave" class="btn-primary">Guardar</button>
        <button onclick="document.getElementById('dynamicModal').style.display='none'" class="btn-secondary">Cancelar</button>
    </div>
</div>
</body>
</html>
